networks:
  default: {}
  whisper-net:
    external: true
  telegram-net:
    external: true
  jaeger-net:
    external: true

services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file: .env
    environment:
      - WHISPER_GRPC_HOST=whisper-ingress
      - WHISPER_GRPC_PORT=50053
      - TELEGRAM_LOCAL_API_URL=http://telegram-bot-api:8081
      - DATABASE_URL=postgres://transcriber:${POSTGRES_PASSWORD:-transcriber}@postgres:5432/transcriber?sslmode=disable
      - OTEL_SERVICE_NAME=transcriber-bot
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    restart: unless-stopped
    networks:
      - default
      - whisper-net       # shared Whisper transcription service
      - telegram-net      # shared local Telegram Bot API (infra/telegram-bot-api)
      - jaeger-net        # shared tracing collector
    extends:
      file: docker-compose.base.yml
      service: base

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=transcriber
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=transcriber
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcriber -d transcriber"]
      interval: 5s
      timeout: 3s
      retries: 10
    extends:
      file: docker-compose.base.yml
      service: base

volumes:
  pgdata:
  telegram-bot-api-data:
    external: true
    name: telegram-bot-api-data
